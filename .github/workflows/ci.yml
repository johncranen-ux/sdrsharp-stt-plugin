name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Proxy tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        # pip-system-certs is a Windows certificate-store shim and is not needed (or
        # installable) here, so the runtime requirements are installed explicitly.
        run: |
          python -m pip install --upgrade pip
          python -m pip install rapidfuzz anthropic websockets certifi pytest

      - name: Run tests
        # No API keys, no GPU, no network: everything external is stubbed in the tests.
        run: python -m pytest server/tests -q

  dotnet:
    name: Plugin tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Only the test project is built. The plugin itself cannot be compiled in CI because
      # it references the proprietary SDR# SDK DLLs, which are not redistributable; the test
      # project links the source files it needs directly for exactly this reason.
      - name: Run tests
        run: dotnet test SDRSharp.SttPlugin.Tests/SDRSharp.SttPlugin.Tests.csproj -c Release

  hygiene:
    name: No secrets, no real traffic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a credential-shaped literal is committed
        run: |
          if git grep -nIE '(sk-ant-api03-[A-Za-z0-9_-]{20}|gsk_[A-Za-z0-9]{20}|hf_[A-Za-z0-9]{20})' \
               -- . ':(exclude)*.md'; then
            echo "::error::A credential-shaped literal is committed. Rotate it and remove it."
            exit 1
          fi
          echo "no credential-shaped literals found"

      - name: Fail if any reference transcript is committed
        run: |
          bad=$(git ls-files 'server/references*.txt' || true)
          if [ -n "$bad" ]; then
            echo "::error::Reference transcripts committed: $bad"
            echo "No transcript file belongs in the repository. See docs/user-manual.md."
            exit 1
          fi
          echo "no transcript files tracked"
