name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Proxy tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        # pip-system-certs is a Windows certificate-store shim and is not needed (or
        # installable) here, so the runtime requirements are installed explicitly.
        run: |
          python -m pip install --upgrade pip
          python -m pip install rapidfuzz anthropic websockets certifi pytest pyflakes

      - name: Check for undefined names
        # Splitting whisper-proxy.py into stt_proxy/ left three names used but never
        # imported. Two sat on branches no test reached (`re` on the fenced-reply path in
        # resolve_conversation, `rf_fuzz` in the buffer match) and broke the resolver for
        # every conversation in production. The third, `datetime` in identify.py, is an
        # import-time error here but invisible on Python 3.14, where PEP 649 defers
        # annotation evaluation -- so the developer's runtime cannot be relied on to show it.
        #
        # Only 'undefined name' fails the build: whisper-proxy.py re-exports a long list of
        # names purely so the tests can reach them, and pyflakes calls every one of those an
        # unused import.
        run: |
          if python -m pyflakes server/ | grep -E 'undefined name'; then
            echo "::error::pyflakes found undefined name(s) -- see above"
            exit 1
          fi

      - name: Run tests
        # No API keys, no GPU, no network: everything external is stubbed in the tests.
        run: python -m pytest server/tests -q

  dotnet:
    name: Plugin tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Only the test project is built. The plugin itself cannot be compiled in CI because
      # it references the proprietary SDR# SDK DLLs, which are not redistributable; the test
      # project links the source files it needs directly for exactly this reason.
      - name: Run tests
        run: dotnet test SDRSharp.SttPlugin.Tests/SDRSharp.SttPlugin.Tests.csproj -c Release

  hygiene:
    name: No secrets, no real traffic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a credential-shaped literal is committed
        run: |
          if git grep -nIE '(sk-ant-api03-[A-Za-z0-9_-]{20}|gsk_[A-Za-z0-9]{20}|hf_[A-Za-z0-9]{20})' \
               -- . ':(exclude)*.md'; then
            echo "::error::A credential-shaped literal is committed. Rotate it and remove it."
            exit 1
          fi
          echo "no credential-shaped literals found"

      - name: Fail if any reference transcript is committed
        # Every pattern here is a file family that carries received radio traffic verbatim.
        # references*.txt was the original; the bench_correct.py artefacts were added after a
        # correction bake-off produced two more -- the results files embed each corrected
        # transcript per clip, and the cache stores every model reply raw. The gate is a list
        # of known-bad names rather than a content scan, so it must grow whenever a new kind
        # of output starts holding transcripts.
        #
        # Grown 2026-08-09 for the IQ replay harness: draft-*/score-* are bench.py runs over
        # replayed arms (score-* additionally embeds the hand-verified reference for every
        # clip), and the bench-identify-* families carry real vessel names and MMSIs.
        run: |
          bad=$(git ls-files \
                  'server/references*.txt' \
                  'server/bench-results*.json' \
                  'server/bench-correct-results*.json' \
                  'server/bench-correct-cache/*' \
                  'server/bench-identify-results*.json' \
                  'server/bench-identify-repeats*.json' \
                  'server/draft-*.json' \
                  'server/draft-*.html' \
                  'server/score-*.json' \
                  'server/score-*.html' || true)
          if [ -n "$bad" ]; then
            echo "::error::Files containing received radio traffic are committed: $bad"
            echo "No transcript file belongs in the repository. See docs/user-manual.md."
            exit 1
          fi
          echo "no transcript files tracked"
